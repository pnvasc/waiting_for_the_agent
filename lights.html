<!doctype html>
<html lang="en" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lights</title>
<link rel="stylesheet" href="css/deck.css">
<!--
  A rehearsal page for the light of the piece alone: my window switching, one
  soft glow per switch, on the piece's clock (piece.config.json, 'time').

    S or space   play / stop
    R            put the glows somewhere else
    D            night paper (or open lights.html?theme=night)
-->
<style>
  /* The glows sit on the paper, under anything drawn on it. */
  #stage .lights {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  #readout {
    position: absolute;
    left: 56px;
    bottom: 40px;
    font-family: var(--mono);
    font-size: 16px;
    color: var(--ink-2);
    letter-spacing: .02em;
  }
  #readout .time { color: var(--rubric); }
</style>
</head>
<body>
<div id="stage-wrap">
  <div id="stage">
    <p id="readout">loading…</p>
  </div>
</div>

<script type="module">
  import { Lights, pulses, busiestSecond } from './js/lights.js';

  const stage = document.getElementById('stage');
  if (new URLSearchParams(location.search).get('theme') === 'night') {
    document.documentElement.dataset.theme = 'night';
  }
  const readout = document.getElementById('readout');

  // The same fit-to-window as the deck: one scale for the 1600 x 900 stage.
  const fit = () => {
    const k = Math.min(innerWidth / 1600, innerHeight / 900);
    stage.style.transform = `scale(${k})`;
  };
  addEventListener('resize', fit);
  fit();

  const get = (path) => fetch(path, { cache: 'no-store' }).then((r) => r.json());
  const [config, piece] = await Promise.all([get('piece.config.json'), get('data/piece.json')]);

  const tc = config.time;
  const played = tc.target - (tc.tail || 0);    // the piece's played length
  const lights = new Lights(stage, config.light);
  let list = [];

  function place() {
    list = pulses(piece.light, played, config.light);
    lights.set(list);
  }
  place();

  const summary = `${list.length} glows in ${played} s · `
    + `busiest second ${busiestSecond(list)}`;
  readout.textContent = summary;

  let start = null;
  let frame = null;
  function tick() {
    const t = (performance.now() - start) / 1000;
    lights.render(t);
    readout.innerHTML = `<span class="time">${t.toFixed(1)} s</span> · ${summary}`;
    if (t < played + config.light.release + 1) frame = requestAnimationFrame(tick);
    else stop();
  }
  function play() { start = performance.now(); frame = requestAnimationFrame(tick); }
  function stop() {
    cancelAnimationFrame(frame);
    frame = null;
    lights.clear();
    readout.textContent = summary;
  }

  addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (k === 's' || k === ' ') { e.preventDefault(); frame ? stop() : play(); }
    if (k === 'r') { place(); if (frame) play(); }
    if (k === 'd') {
      const root = document.documentElement;
      root.dataset.theme = root.dataset.theme === 'night' ? 'day' : 'night';
    }
  });

  // For the headless check: ?at=12.5 draws that moment and stops there.
  const at = new URLSearchParams(location.search).get('at');
  if (at !== null) { lights.render(Number(at)); readout.textContent = `${at} s · ${summary}`; }
</script>
</body>
</html>
